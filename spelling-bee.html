<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spelling Bee Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;display=swap" rel="stylesheet">
<style id="css">
/* Layout: one narrow phone column. Summary on top, two tabs, a list you tap or a card you answer. */
:root{
  --bg:#EEF1EE; --surface:#FFFFFF; --ink:#16201C; --muted:#586660; --line:#D3DBD6;
  --accent:#F0B310; --on-accent:#16201C;
  --good:#1B7F53; --good-bg:#DDF1E6; --warn:#B54E14; --warn-bg:#FBE6D8;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111614; --surface:#1A221F; --ink:#E8EEEA; --muted:#9BA9A2; --line:#2D3833;
    --accent:#F2BC33; --on-accent:#16201C;
    --good:#58CB95; --good-bg:#173527; --warn:#F2935A; --warn-bg:#3D2416;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#1A221F; --ink:#E8EEEA; --muted:#9BA9A2; --line:#2D3833;
  --accent:#F2BC33; --on-accent:#16201C;
  --good:#58CB95; --good-bg:#173527; --warn:#F2935A; --warn-bg:#3D2416;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4}
#root{max-width:560px;margin:0 auto;padding:20px 16px 96px;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.3rem;font-weight:600}
p{margin:0}
button,select,a{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-direction:column;gap:12px}
.title{display:flex;flex-direction:column;gap:2px}
#when{color:var(--muted);font-size:.95rem}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%}
.bar .g{background:var(--good)}
.bar .p{background:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.92rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:6px}
.legend b{color:var(--ink)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--line)}
.dot.g{background:var(--good)} .dot.p{background:var(--warn)}

.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--line);padding:4px;border-radius:12px}
.tabs a{text-align:center;text-decoration:none;padding:10px;border-radius:9px;font-weight:700;color:var(--muted)}
.tabs a[aria-current="page"]{background:var(--surface);color:var(--ink)}

.pick{display:flex;align-items:center;gap:10px}
.pick label{color:var(--muted);font-size:.95rem}
.pick select{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}

#view{display:flex;flex-direction:column;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:.92rem;font-variant-numeric:tabular-nums}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hint{color:var(--muted);font-size:.9rem}

.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.list li+li{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 12px;border:0;background:none;text-align:left}
.row .n{width:2.2em;text-align:right;color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums;flex:none}
.row .w{flex:1;min-width:0;font-size:1.12rem;overflow-wrap:anywhere}
.pill{flex:none;font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.s1{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.s2{background:var(--good-bg);color:var(--good);border-color:transparent}
.empty{padding:24px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px}

.panel,.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 16px;display:flex;flex-direction:column;gap:16px}
.check{display:flex;align-items:center;gap:10px}
.check input{width:20px;height:20px;accent-color:var(--good)}
.primary{background:var(--accent);color:var(--on-accent);border:0;border-radius:12px;padding:14px;font-weight:700;font-size:1.05rem}
.primary:disabled{opacity:.45;cursor:default}
.plain{background:none;border:1px solid var(--line);border-radius:12px;padding:13px;font-weight:700}
.link{background:none;border:0;padding:4px 0;color:var(--muted);text-decoration:underline;font-size:.92rem}
.cardtop{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.92rem;font-variant-numeric:tabular-nums}
.wordbox{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:12px 0}
.num{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.word{font-size:clamp(2rem,10vw,3.1rem);font-weight:700;line-height:1.1;overflow-wrap:anywhere;letter-spacing:.01em}
.look{color:var(--muted);font-size:.92rem}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.answers button{border:0;border-radius:12px;padding:18px 8px;font-weight:700;font-size:1.1rem}
.miss{background:var(--warn-bg);color:var(--warn)}
.got{background:var(--good);color:var(--surface)}
.missed{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;font-size:1.08rem}
.stack{display:flex;flex-direction:column;gap:10px}

#foot{color:var(--muted);font-size:.88rem;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.confirm{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

#sync{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg)}
#sync[hidden]{display:none}
#sync .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
#sync span{flex:1;min-width:0;font-size:.95rem}
#sync button{flex:none;background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;padding:10px 16px;font-weight:700}
#sync button:disabled{opacity:.6}
</style>
</head>
<body>
<div id="root"></div>
<script id="state" type="application/json">{"v":1,"s":{}}</script>
<script id="app">
(function(){
"use strict";

var WORDS=("wind,dirt,good,hurt,bunny,steps,silly,path,stars,fire,hello,late,shell,wings,easy,house,shift,tusk,seal,dive,crack,fine,apple,mossy,shine,"+
"beans,spray,truth,rabbit,tallest,frozen,cliffs,market,crunch,beware,sweater,wrong,money,darkness,sprout,shadows,alive,friend,return,swift,footprints,thirsty,gentle,voice,pancake,"+
"lead,sloth,cloak,whistle,indoors,relax,holiday,stout,entire,guide,mustard,ginger,medium,hiking,afraid,result,source,tangy,shivering,grumpily,cottage,seventy,distance,soared,bamboo,"+
"cuddle,tiptoed,basement,wetlands,butterflies,property,sniffling,tractor,awning,relief,boycotting,elite,proclaim,custody,warrior,fierce,salary,hurdler,jovial,December,dictionary,reinstate,versus,opposite,marlin,"+
"compliment,incident,investment,cutlery,fundraiser,bellowed,quail,disappointment,pamphlet,suggested,desperate,interruption,piñata,stragglers,ridiculous,exploratory,bratwurst,integrity,rebuttal,solidarity,sputnik,segregation,civilian,apprentice,Caesar,"+
"glamorous|glamourous,suspension,fictitious,snarkiness,collateral,mascara,precedent,magnesium,haddock,optometrist,cosmodrome,schnauzer,regolith,persnickety|persnickity,pheasants,Senegal,duende,Polaroid,matrilineal,arnica,glaucoma,adrenaline,staccato,romerillo,Aeolus,"+
"thrummed,lapels,burnished,unrelenting,imperial,arsonists,generator,authority,doberman,decisively,inanimate,auditory,sentinels,self-sufficient,subscription,conspicuous,procession,perpendicular,seminal,torrential,consulate,sauntered,modish,juniper,unconscious,"+
"palazzo,foliage,irrelevant,quizzically,diplomatically,increments,calibrate,reassurance,credenza,protectorate,phenomenon,pulmonary,alleviate,approximation,legation,censers,diffidence,pathologically,butane,glycerin|glycerine,cataract,alabaster,quiche,arugula,euphemism,"+
"vibrometer,acolyte,mayonnaise,innocuous,sputum,Tripoli,cerulean|caerulean,neurological,cul-de-sac,mysticetes,electrolytes,Eritrea,ototoxic,forsythia,Aphrodite,salicylic acid,bogong moth,stomatopods,yakuza,frankincense,Krio,solenodon,Addis Ababa,lactobacillus,spes phthisica,"+
"brand,never,sheet,soul,trunk,flesh,hound,beckon,darkroom,looting,gopher,sliver,grapevine,budget,nursery,avid,bandage,wrath,throttle,creamery,worry,chest,piggy,carry,bones,"+
"schools,cheeky,itching,crisscross,backyard,ice cream,dagger,bluff,fritter,fanfare,dingy,ashen,excuse,public,rosemary,concern,usually,wrapper,scrimpy,thrice,hickory,specialty,convent,pursue,feature,"+
"bassist,community,instinct,dismayed,zinger,shrewd,futon,measles,burgundy,prelude,pumice,socialite,profession,certainty,bulbous,cabinetry,discussion,grievous,proportion,traitorous,addictive,conjecture,fiefdom,compatible,compulsory,"+
"corridor,Manchester,migraine,internally,penchant,respective,iteration,credentials,incriminate,recuperate,chronicle,detonate,tureen,subsidy,punitive,drudgery,Venn diagram,lucrative,helter-skelter,wherewithal,frivolity,ideogram,organza,caucus,pandemonium,"+
"metallurgical,pseudonym,dugong,ectopic,heliolatry,rumbustical,ruminant,opossum,gondolier,squaliform,crucible,envisage,evocative,serviette,Herculean,dichotomy,incredulous,coyote,basilisk,Mandarin,quadrupedal,poignant,helophyte,pluvioscope,gelometer,"+
"heiferette,atomism,juridical,kensington,summitry,aerodynamicist,sigmoid,cronyism,recidivism,veronica,acrotrophic,carpe diem,botulism,balustrade,rottweiler,violaceous,aspartame,ichorous,Zanzibar,castaneous,vindaloo,mycelium,eglantine,turpitude,caballero,"+
"sriracha,obsequy,maniple,obtenebrate,mirin,zymurgy,decurtate,genoise,coruscation,catastasis,chimichanga,recibiendo,hauberget,ravigote,fusuma,mignonette,redondilla,Tallahassee,cipollini,caterwaul,remicle,fasciitis,reblochon,rachiodont,Borinqueño").split(",");
var N=WORDS.length;

var LABEL=["Not yet","Practicing","Got it"];
var NEXT=[2,0,1];
var KEY="bee-marks-v1", UIKEY="bee-ui-v1";

var RANGES=[["All "+N+" words",0,N],["Main list, 1–225",0,225],["Additional words, 226–"+N,225,N]];
for(var a=0;a<N;a+=25){RANGES.push(["Words "+(a+1)+"–"+Math.min(a+25,N),a,Math.min(a+25,N)]);}

/* ---- marks: shared copy lives in the page, unsynced marks live on this phone ---- */
var base={};
try{base=JSON.parse(document.getElementById("state").textContent).s||{};}catch(e){base={};}
var pending={};
try{pending=JSON.parse(localStorage.getItem(KEY)||"{}")||{};}catch(e){pending={};}
Object.keys(pending).forEach(function(k){
  var p=pending[k], b=base[k];
  if(!p||(b&&b[1]>=p[1])||(!b&&p[0]===0)){delete pending[k];}
});
function persist(){try{localStorage.setItem(KEY,JSON.stringify(pending));}catch(e){}}
persist();
function st(i){var p=pending[i]||base[i];return p?p[0]:0;}
function mark(i,v){
  if(st(i)===v){return;}
  pending[i]=[v,Math.floor(Date.now()/1000)];
  persist();
}
function pendingCount(){return Object.keys(pending).length;}

/* ---- screen state ---- */
var ui={range:0,filter:-1,skipGot:true};
try{var saved=JSON.parse(localStorage.getItem(UIKEY)||"{}");if(saved.range>=0&&saved.range<RANGES.length){ui.range=saved.range;}}catch(e){}
function saveUi(){try{localStorage.setItem(UIKEY,JSON.stringify({range:ui.range}));}catch(e){}}
var view="words", quiz=null, confirmClear=false;
var artifact=null, syncing=false, syncMsg="";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function show(i){return WORDS[i].split("|").join(" or ");}
function lookup(i){return "https://www.merriam-webster.com/dictionary/"+encodeURIComponent(WORDS[i].split("|")[0]);}
function counts(lo,hi){var c=[0,0,0];for(var i=lo;i<hi;i++){c[st(i)]++;}return c;}
function $(id){return document.getElementById(id);}

/* ---- build the fixed frame once ---- */
var opts=RANGES.map(function(r,i){return '<option value="'+i+'">'+esc(r[0])+'</option>';});
$("root").innerHTML=
  '<header class="top"><div class="title"><h1>Spelling Bee</h1><p id="when"></p></div><div id="prog"></div></header>'+
  '<nav class="tabs" aria-label="Sections"><a href="#words" id="t-words">Words</a><a href="#quiz" id="t-quiz">Quiz</a></nav>'+
  '<div class="pick"><label for="range">Showing</label><select id="range">'+opts.slice(0,3).join("")+
  '<optgroup label="Sets of 25">'+opts.slice(3).join("")+'</optgroup></select></div>'+
  '<main id="view"></main><footer id="foot"></footer>'+
  '<div id="sync" hidden></div>';
$("range").value=String(ui.range);

(function(){
  var now=new Date(), today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  var d=Math.round((new Date(2026,11,10)-today)/864e5);
  var t="School bee: Thursday, December 10, 10:00 AM";
  if(d>1){t+=" · "+d+" days left";}else if(d===1){t+=" · tomorrow";}else if(d===0){t+=" · today";}
  $("when").textContent=t;
})();

function renderProg(){
  var c=counts(0,N);
  $("prog").innerHTML=
    '<div class="bar" role="img" aria-label="'+c[2]+' of '+N+' words marked Got it"><i class="g" style="width:'+(c[2]/N*100)+'%"></i><i class="p" style="width:'+(c[1]/N*100)+'%"></i></div>'+
    '<div class="legend"><span><span class="dot g"></span><b>'+c[2]+'</b> got it</span><span><span class="dot p"></span><b>'+c[1]+'</b> practicing</span><span><span class="dot"></span><b>'+c[0]+'</b> not yet</span></div>';
}

function chipsHtml(){
  var r=RANGES[ui.range], c=counts(r[1],r[2]);
  var items=[[-1,"All",r[2]-r[1]],[0,"Not yet",c[0]],[1,"Practicing",c[1]],[2,"Got it",c[2]]];
  return items.map(function(it){
    return '<button type="button" data-act="filter" data-f="'+it[0]+'" aria-pressed="'+(ui.filter===it[0])+'">'+it[1]+' '+it[2]+'</button>';
  }).join("");
}
function rowHtml(i){
  var s=st(i);
  return '<li><button type="button" class="row" data-act="cycle" data-i="'+i+'"><span class="n">'+(i+1)+'</span><span class="w">'+esc(show(i))+'</span><span class="pill s'+s+'">'+LABEL[s]+'</span></button></li>';
}
function renderWords(){
  var r=RANGES[ui.range], rows=[];
  for(var i=r[1];i<r[2];i++){if(ui.filter<0||st(i)===ui.filter){rows.push(rowHtml(i));}}
  $("view").innerHTML=
    '<div class="chips" id="chips" role="group" aria-label="Filter by mark">'+chipsHtml()+'</div>'+
    '<p class="hint">Tap a word to change its mark.</p>'+
    (rows.length?'<ol class="list">'+rows.join("")+'</ol>':'<p class="empty">No words with this mark in this set.</p>');
}

function pool(){
  var r=RANGES[ui.range], out=[];
  for(var i=r[1];i<r[2];i++){if(!ui.skipGot||st(i)!==2){out.push(i);}}
  return out;
}
function shuffle(arr){
  for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}
  return arr;
}
function startQuiz(list){quiz={queue:shuffle(list.slice()),pos:0,got:[],missed:[],done:false};}
function renderQuiz(){
  var h;
  if(!quiz){
    var n=pool().length;
    h='<section class="panel"><p>Read each word aloud. He spells it, then you tap how it went.</p>'+
      '<label class="check" for="skipgot"><input type="checkbox" id="skipgot"'+(ui.skipGot?" checked":"")+'> Skip words marked Got it</label>'+
      '<button type="button" class="primary" data-act="start"'+(n?"":" disabled")+'>'+(n?"Start quiz · "+n+" word"+(n===1?"":"s"):"Nothing left to quiz in this set")+'</button></section>';
  }else if(quiz.done){
    var g=quiz.got.length, m=quiz.missed.length;
    h='<section class="panel"><h2>Round done</h2><p>Got '+g+', missed '+m+'.</p>'+
      (m?'<ul class="missed">'+quiz.missed.map(function(i){return '<li>'+esc(show(i))+'</li>';}).join("")+'</ul>':'')+
      '<div class="stack">'+(m?'<button type="button" class="primary" data-act="retry">Quiz the missed words</button>':'')+
      '<button type="button" class="'+(m?"plain":"primary")+'" data-act="new">New round</button></div></section>';
  }else{
    var i=quiz.queue[quiz.pos];
    h='<section class="card"><div class="cardtop"><span>Word '+(quiz.pos+1)+' of '+quiz.queue.length+'</span><button type="button" class="link" data-act="stop">End quiz</button></div>'+
      '<div class="wordbox"><p class="num">No. '+(i+1)+'</p><p class="word">'+esc(show(i))+'</p>'+
      '<a class="look" href="'+lookup(i)+'" target="_blank" rel="noopener">Pronunciation and meaning at Merriam-Webster</a></div>'+
      '<div class="answers"><button type="button" class="miss" data-act="miss">Missed</button><button type="button" class="got" data-act="got">Got it</button></div></section>';
  }
  $("view").innerHTML=h;
}

function renderView(){
  $("t-words").setAttribute("aria-current",view==="words"?"page":"false");
  $("t-quiz").setAttribute("aria-current",view==="quiz"?"page":"false");
  if(view==="words"){renderWords();}else{renderQuiz();}
}
function renderFoot(){
  var note=artifact?"Marks save on this phone right away. Sync shares them with everyone who opens this page.":"Marks are saved on this phone.";
  var any=counts(0,N);
  var clear="";
  if(confirmClear){clear='<div class="confirm"><span>Clear every mark?</span><button type="button" class="link" data-act="clear-yes">Yes, clear all</button><button type="button" class="link" data-act="clear-no">Cancel</button></div>';}
  else if(any[1]+any[2]>0){clear='<button type="button" class="link" data-act="clear">Clear all marks</button>';}
  $("foot").innerHTML='<p>'+note+'</p>'+clear;
}
function renderSync(){
  var el=$("sync"), n=pendingCount();
  if(!artifact||(!n&&!syncMsg)){el.hidden=true;return;}
  el.hidden=false;
  var text=syncMsg||(n+" mark"+(n===1?"":"s")+" not synced yet");
  el.innerHTML='<div class="in"><span role="status">'+esc(text)+'</span>'+(n?'<button type="button" data-act="sync"'+(syncing?" disabled":"")+'>'+(syncing?"Syncing…":"Sync")+'</button>':'')+'</div>';
}
function refreshSummary(){renderProg();renderFoot();renderSync();}

function sync(){}

/* ---- taps ---- */
$("root").addEventListener("click",function(ev){
  var el=ev.target.closest?ev.target.closest("[data-act]"):null;
  if(!el){return;}
  var act=el.getAttribute("data-act"), i;
  if(act==="cycle"){
    i=+el.getAttribute("data-i");
    mark(i,NEXT[st(i)]);
    var s=st(i), pill=el.querySelector(".pill");
    pill.className="pill s"+s;pill.textContent=LABEL[s];
    var ch=$("chips");if(ch){ch.innerHTML=chipsHtml();}
    syncMsg="";refreshSummary();
  }else if(act==="filter"){
    ui.filter=+el.getAttribute("data-f");renderWords();
  }else if(act==="start"){
    var p=pool();if(p.length){startQuiz(p);renderQuiz();}
  }else if(act==="got"||act==="miss"){
    if(!quiz||quiz.done){return;}
    i=quiz.queue[quiz.pos];
    if(act==="got"){mark(i,2);quiz.got.push(i);}else{mark(i,1);quiz.missed.push(i);}
    quiz.pos++;
    if(quiz.pos>=quiz.queue.length){quiz.done=true;}
    syncMsg="";renderQuiz();refreshSummary();
  }else if(act==="stop"){
    if(quiz&&(quiz.got.length||quiz.missed.length)){quiz.done=true;}else{quiz=null;}
    renderQuiz();
  }else if(act==="retry"){
    if(quiz&&quiz.missed.length){startQuiz(quiz.missed);renderQuiz();}
  }else if(act==="new"){
    quiz=null;renderQuiz();
  }else if(act==="clear"){
    confirmClear=true;renderFoot();
  }else if(act==="clear-no"){
    confirmClear=false;renderFoot();
  }else if(act==="clear-yes"){
    for(i=0;i<N;i++){if(st(i)!==0){mark(i,0);}}
    Object.keys(pending).forEach(function(k){if(!base[k]&&pending[k][0]===0){delete pending[k];}});
    persist();confirmClear=false;quiz=null;syncMsg="";renderView();refreshSummary();
  }else if(act==="sync"){
    sync();
  }
});
$("root").addEventListener("change",function(ev){
  if(ev.target.id==="range"){ui.range=+ev.target.value;saveUi();quiz=null;renderView();}
  else if(ev.target.id==="skipgot"){ui.skipGot=ev.target.checked;renderQuiz();}
});
function readHash(){view=location.hash==="#quiz"?"quiz":"words";}
window.addEventListener("hashchange",function(){readHash();renderView();});

readHash();renderView();refreshSummary();
})();
</script>
